<!doctype html><html lang="ja"><meta charset="utf-8"><title>ScreenDraft</title><link rel="stylesheet" href="popup.css"><body>
<h1>ScreenDraft</h1><p>開いている画面をドラフトに追加します。</p>
<label>接続先<input id="endpoint" value="http://127.0.0.1:4173" placeholder="http://127.0.0.1:4173"></label>
<label>接続キー<input id="key" type="password" autocomplete="off"></label><button id="connect">接続する</button>
<section id="connected" hidden><label>ドラフト<select id="proposal"></select></label><button id="capture">この画面を取得</button><button id="batch" class="secondary">画面候補を探す・一括取り込み</button></section>
<section id="review" hidden><label>保存方法<select id="save-target"><option value="">別の画面として追加</option></select></label><p id="target-note" class="note">新しい画面として追加します。</p><label>画面名<input id="title" maxlength="300"></label><p id="summary"></p><p class="note">名前・メールアドレス・入力値なども含まれます。保存前に元画面を確認してください。取得中はこのポップアップを開いたままにしてください。</p><p id="warnings"></p><button id="grant" class="secondary" hidden>不足リソースへのアクセスを許可して再取得</button><div id="capture-preview"></div><button id="save">この画面を保存</button><button id="export" class="secondary">JSONを書き出す</button></section>
<p id="status" role="status"></p><script type="module" src="popup.js"></script></body></html>
