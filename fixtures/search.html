<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>ユーザー検索</title><link rel="stylesheet" href="/sample-static/sample/app.css"></head><body><header><strong>サンプル管理画面</strong><nav>ダッシュボード　 <b>ユーザー検索</b>　 設定</nav></header><main><p class="eyebrow">SEARCH</p><h1>ユーザー検索</h1><p class="description">条件を指定して、対象のユーザーを探します。</p><form class="profile" aria-label="検索条件"><label>氏名・メールアドレス<input name="keyword" placeholder="名前やメールアドレスを入力"></label><label>ステータス<select name="status"><option selected>すべて</option><option>有効</option><option>停止中</option></select></label><label>登録日<input type="date" name="registeredAfter"></label><button class="primary" type="submit">この条件で検索</button></form><aside class="notice">表示例の画面です。検索処理は実行されません。</aside></main></body></html>
