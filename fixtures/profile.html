<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>プロフィール設定</title><link rel="stylesheet" href="/sample-static/sample/app.css"></head><body><header><strong><img class="brand-logo" src="/sample-static/sample/mark.svg" alt=""> サンプルマイページ</strong><nav>マイページ　 <b>設定</b></nav></header><main><p class="eyebrow">PROFILE</p><h1>プロフィール設定</h1><p class="description">あなたの基本情報を確認・変更できます。</p><form class="profile"><label>氏名<input name="name" value="山田 花子"></label><label>メールアドレス<input name="email" type="email" value="hana@example.com"></label><label>お知らせの受け取り<select><option selected>受け取る</option><option>受け取らない</option></select></label><label class="check"><input type="checkbox" checked>メールでのお知らせを受け取る</label><button class="primary" type="submit">保存する</button></form><aside class="notice">この画面のコピーから、ドラフトを作成できます。</aside></main></body></html>
